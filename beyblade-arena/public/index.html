<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>戰鬥陀螺 ARENA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234da3ff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8eefc'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── 主選單 ───────────────────────────────────────────── -->
<section id="screen-menu" class="screen active">
  <header class="title">
    <h1>戰鬥陀螺 <span>ARENA</span></h1>
    <p>物理對戰 · 改裝陀螺 · 線上 1v1</p>
  </header>

  <div class="menu-grid">
    <div class="panel">
      <h2>對戰模式</h2>
      <div class="modes">
        <button class="mode" data-mode="solo">
          <strong>單人挑戰</strong><span>對電腦</span>
        </button>
        <button class="mode" data-mode="local">
          <strong>雙人同機</strong><span>同一鍵盤</span>
        </button>
        <button class="mode" data-mode="online">
          <strong>線上對戰</strong><span>房號連線</span>
        </button>
      </div>

      <h2>電腦難度</h2>
      <div class="chips" id="difficulty">
        <button class="chip" data-diff="easy">簡單</button>
        <button class="chip active" data-diff="normal">普通</button>
        <button class="chip" data-diff="hard">困難</button>
      </div>

      <h2>操作說明</h2>
      <ul class="help">
        <li><b>蓄力發射</b>：按住 <kbd>空白鍵</kbd>，量表衝到最高時放開</li>
        <li><b>移動</b>：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵（也可用滑鼠/手指拖曳）</li>
        <li><b>衝刺</b>：戰鬥中按 <kbd>空白鍵</kbd>，消耗迴轉力猛撞對手</li>
        <li>雙人同機：2P 使用方向鍵 + <kbd>Enter</kbd></li>
      </ul>
    </div>

    <div class="panel">
      <h2>陀螺改裝</h2>
      <div class="chips" id="presets"></div>
      <div class="garage">
        <div class="part-row"><label>層片 Layer</label><div class="chips" id="pick-layer"></div></div>
        <div class="part-row"><label>圓盤 Disc</label><div class="chips" id="pick-disc"></div></div>
        <div class="part-row"><label>軸心 Driver</label><div class="chips" id="pick-driver"></div></div>
        <div class="part-row"><label>旋轉方向</label>
          <div class="chips" id="pick-spin">
            <button class="chip active" data-spin="1">右旋</button>
            <button class="chip" data-spin="-1">左旋</button>
          </div>
        </div>
      </div>
      <div class="spec">
        <canvas id="preview" width="180" height="180"></canvas>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
  <p class="foot">勝利條件：先拿到 <b>4 分</b>。迴轉結束 +1 · 場外結束 +2 · 爆裂結束 +3</p>
</section>

<!-- ── 線上大廳 ─────────────────────────────────────────── -->
<section id="screen-lobby" class="screen">
  <div class="panel lobby">
    <h2>線上對戰</h2>
    <div class="lobby-actions">
      <button class="primary" id="btn-create">建立房間</button>
      <div class="join">
        <input id="join-code" maxlength="4" placeholder="房號" autocomplete="off" />
        <button class="primary" id="btn-join">加入</button>
      </div>
    </div>
    <div class="room" id="room-info" hidden>
      <p>房號</p>
      <div class="code" id="room-code">----</div>
      <p class="muted" id="room-status">等待對手加入…</p>
    </div>
    <p class="error" id="lobby-error"></p>
    <button class="ghost" id="btn-lobby-back">返回</button>
  </div>
</section>

<!-- ── 戰鬥畫面 ─────────────────────────────────────────── -->
<section id="screen-game" class="screen">
  <div class="arena-wrap">
    <canvas id="arena" width="900" height="900"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="player p1">
          <div class="pname" id="p1-name">玩家 1</div>
          <div class="bar spin"><i id="p1-spin"></i></div>
          <div class="bar burst"><i id="p1-burst"></i></div>
          <div class="dots" id="p1-dots"></div>
        </div>
        <div class="center">
          <div class="round" id="round-label">ROUND 1</div>
          <div class="timer" id="timer">90</div>
        </div>
        <div class="player p2">
          <div class="pname" id="p2-name">玩家 2</div>
          <div class="bar spin"><i id="p2-spin"></i></div>
          <div class="bar burst"><i id="p2-burst"></i></div>
          <div class="dots" id="p2-dots"></div>
        </div>
      </div>

      <div class="launcher" id="launcher">
        <div class="launch-label">按住 <kbd>空白鍵</kbd> 蓄力，放開發射</div>
        <div class="meter"><i id="meter-fill"></i><span class="sweet"></span></div>
        <div class="launch-sub" id="launch-sub"></div>
      </div>

      <div class="banner" id="banner" hidden>
        <div class="banner-title" id="banner-title"></div>
        <div class="banner-sub" id="banner-sub"></div>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-title" id="result-title"></div>
        <div class="result-score" id="result-score"></div>
        <div class="result-actions">
          <button class="primary" id="btn-rematch">再戰一場</button>
          <button class="ghost" id="btn-quit">回到選單</button>
        </div>
      </div>

      <button class="ghost corner" id="btn-back">離開</button>
    </div>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
